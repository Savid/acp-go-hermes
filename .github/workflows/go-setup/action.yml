name: "Setup Go"
description: "Set up Go environment with caching"

inputs:
  go-version:
    description: "Go version to use"
    required: false
    default: "1.26.3"

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        check-latest: true
        cache: true
